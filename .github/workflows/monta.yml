# Motore di montaggio di A' Villetta
# Ogni 10 minuti (8-23 ora italiana) chiede alla Regia se c'è un reel da montare.
# Si presenta con l'identità firmata da GitHub (OIDC): nessuna chiave salvata qui.
# Il montatore è lavoro.py (in questo archivio); clip, piano e risultato passano dalla Regia.
name: monta

on:
  schedule:
    - cron: "*/10 7-22 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [monta]

permissions:
  id-token: write
  contents: read

concurrency:
  group: montaggio
  cancel-in-progress: false

env:
  REGIA: https://avilletta-regia.gestionalelcl.workers.dev

jobs:
  monta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: C'è un lavoro?
        id: next
        run: |
          set -e
          TOKEN=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=avilletta-regia" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          CODE=$(curl -sS -o job.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -X POST "$REGIA/api/montaggio/prossimo")
          echo "risposta Regia: $CODE"
          if [ "$CODE" = "200" ]; then echo "lavoro=si" >> "$GITHUB_OUTPUT"; else echo "lavoro=no" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.next.outputs.lavoro == 'si'

      - name: Strumenti
        if: steps.next.outputs.lavoro == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -version | head -1

      - name: Monta
        if: steps.next.outputs.lavoro == 'si'
        run: |
          set -e
          JOB=$(python3 -c 'import json;print(json.load(open("job.json"))["id"])')
          PASS=$(python3 -c 'import json;print(json.load(open("job.json"))["pass"])')
          echo "::add-mask::$PASS"
          JOB="$JOB" PASS="$PASS" python3 lavoro.py
