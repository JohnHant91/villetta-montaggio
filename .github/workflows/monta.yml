# Motore di montaggio di A' Villetta
# Ogni 10 minuti (8-23 ora italiana) chiede alla Regia se c'è un reel da montare.
# Si presenta con l'identità firmata da GitHub (OIDC): nessuna chiave salvata qui.
# Il montatore è lavoro.py (in questo archivio); clip, piano e risultato passano dalla Regia.
name: monta

on:
  schedule:
    - cron: "*/10 7-22 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
  repository_dispatch:
    types: [monta]

permissions:
  id-token: write
  contents: write

concurrency:
  group: montaggio
  cancel-in-progress: false

env:
  REGIA: https://avilletta-regia.gestionalelcl.workers.dev

jobs:
  monta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: C'è un lavoro?
        id: next
        run: |
          set -e
          TOKEN=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=avilletta-regia" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          CODE=$(curl -sS -o "$RUNNER_TEMP/job.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -X POST "$REGIA/api/montaggio/prossimo")
          echo "risposta Regia: $CODE"
          if [ "$CODE" = "200" ]; then echo "lavoro=si" >> "$GITHUB_OUTPUT"; else echo "lavoro=no" >> "$GITHUB_OUTPUT"; fi

      - name: Strumenti
        if: steps.next.outputs.lavoro == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet librosa soundfile faster-whisper || echo "librerie facoltative non installate"
          ffmpeg -version | head -1

      - name: Monta
        if: steps.next.outputs.lavoro == 'si'
        run: |
          set -e
          JOB=$(python3 -c 'import json;print(json.load(open(__import__("os").environ["RUNNER_TEMP"]+"/job.json"))["id"])')
          PASS=$(python3 -c 'import json;print(json.load(open(__import__("os").environ["RUNNER_TEMP"]+"/job.json"))["pass"])')
          echo "::add-mask::$PASS"
          mkdir -p "$RUNNER_TEMP/anteprima"
          set -o pipefail
          JOB="$JOB" PASS="$PASS" python3 lavoro.py 2>&1 | tee "$RUNNER_TEMP/registro.txt"
          if grep -q '"anteprima": *true' "$RUNNER_TEMP/job.json" 2>/dev/null || ls "$RUNNER_TEMP/anteprima"/*.jpg >/dev/null 2>&1; then cp "$RUNNER_TEMP/registro.txt" "$RUNNER_TEMP/anteprima/registro-$JOB.txt"; fi

      - name: Anteprima (solo prove)
        if: steps.next.outputs.lavoro == 'si'
        run: |
          D="$RUNNER_TEMP/anteprima"
          [ -d "$D" ] && ls "$D"/*.jpg >/dev/null 2>&1 || exit 0
          cd "$D"
          git init -q && git checkout -q -b anteprime
          git config user.name "montatore" && git config user.email "montatore@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin anteprime && git reset -q FETCH_HEAD || true
          git add *.jpg *.txt 2>/dev/null; git add -A && git commit -qm "anteprima" && git push -q origin anteprime
